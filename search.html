<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokéAPI search Pokémon | Pokédex DevOps Demo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="images/pokeball.png">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">Pokédex</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="search.html">PokéAPI search</a>
      <a href="all.html">All Pokémon</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="page">
    <section class="panel">
      <p class="eyebrow">PokéAPI search</p>
      <h1>Search a Pokémon</h1>
      <p class="subtitle">PokéAPI search by Pokémon name, for example pikachu, charizard, or mewtwo.</p>

      <form id="search-form" class="search-form">
        <input id="pokemon-input" type="text" placeholder="Enter Pokémon name" autocomplete="off">
        <button type="submit">PokéAPI search</button>
      </form>

      <p id="message" class="message"></p>
    </section>
  </main>

  <script src="js/search.js"></script>
